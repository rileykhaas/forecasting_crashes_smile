[project]
# Short explicit pipeline id so page titles read "fcs:<dataframe>" (the chartbook
# template prefixes titles with the id) instead of a long, cut-off scope. Set
# explicitly rather than deriving a personal scope from the git remote.
id = "fcs"
name = "Forecasting Crashes with a Smile"
description = "Replication and extension of Martin & Shi (2025), 'Forecasting Crashes with a Smile'"
maintainer = "Riley Haas and Marija Jovicic"
contributors = ["Riley Haas and Marija Jovicic"]
os_compatibility = ["Windows", "Linux", "macOS"]
build = """
conda env create -f environment.yml
conda activate forecasting_crashes_smile
doit
"""

[notebooks]


[notebooks.01_data_tour]
name = "Data Tour"
description = "A guided tour of the cleaned firm-month panel and the crash-probability bounds: the option-implied volatility surface, the recovered risk-neutral densities, and the lower/upper bounds tested against realized crashes."
path = "_output/01_data_tour.ipynb"




[dataframes]

[dataframes.sp500_secid_universe]
name = "S&P 500 Constituent secid Universe"
description = "Month-end panel of S&P 500 index members with their OptionMetrics secid attached; the firm universe on which the crash-probability bounds are computed."
sources = ["CRSP", "OptionMetrics"]
providers = ["WRDS"]
provider_links = ["https://wrds-www.wharton.upenn.edu/"]
access_types = ["Subscription"]
license = "CRSP / OptionMetrics via WRDS, subscription required; raw data must not be redistributed or committed to git."
restrictions = "Academic WRDS subscription. Do not commit the underlying parquet (it lives in the gitignored _data/)."
pull_method = "WRDS SQL (crsp.msp500list, wrdsapps_link_crsp_optionm.opcrsphist) via pull_sp500.py + pull_link.py, joined onto NYSE month-ends in sp500_secid_universe.py"
tags = ["S&P 500", "constituents", "OptionMetrics", "CRSP", "universe"]
date_col = "date"
path = "./_data/sp500_secid_universe.parquet"
docs_path = "./docs_src/dataframes/sp500_secid_universe.md"

[dataframes.optionm_vol_surface]
name = "OptionMetrics Volatility Surface (raw)"
